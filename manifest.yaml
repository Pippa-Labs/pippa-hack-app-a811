# Running Tab's contract with Pippa. Everything Pippa shows a user about the
# app comes from this file, and the runtime refuses anything not declared here.

manifest_version: 1

# Every hackathon app keeps nothing between calls.
persistence: none

# Public: shown as "by <name>" next to the app. A pseudonym.
app_author_name: "Agent Binder"

app:
  # hack. + repository name without pippa-hack-, hyphens as underscores.
  id: hack.app_a811
  name: Running Tab
  # Bump this before pushing again once a version is submitted for review.
  version: 0.3.0
  # Never use the word "b-y" here: the badge is split on it.
  summary: >-
    Finds pubs, bars and clubs still open near a UK place, latest closing
    first (past midnight included), and how you'd get home on TfL after each
    one closes. Sends place names to Google Maps and journeys to TfL.

agent_types:
  - personal

outcomes:
  - id: venues.latest
    summary: >-
      Pubs and bars open near a place, latest closing first, with the journey
      home from each at closing time
    example_phrases:
      - where can i still get a drink near
      - which pubs are open late near
      - late drink and how do i get home after
      - what bars are still open around
      - which bar near here closes latest
      - pubs open after midnight near
      - where can i drink late and get home to
      - last orders near and the night bus home
      - is anywhere still serving drinks near
      - which pubs are open till 2am near
    inputs:
      - name: location
        type: string
        required: false
        description: >-
          Where the person is or wants to drink: an area, street, station,
          postcode or "lat, lon" coordinates, written as in the message
          (for example "South Kensington", "N1 9GU", "near Old Street
          station" becomes "Old Street station"). If the message does not
          name a place, return an empty string rather than guessing.
      - name: walk_minutes
        type: integer
        required: false
        description: >-
          How many minutes the person is willing to walk, only if they said so
          (for example "within 5 minutes' walk" is 5). Leave this out entirely
          if they did not mention it. Never guess a value.
      - name: destination
        type: string
        required: false
        description: >-
          Where the person wants to get home to afterwards, only if the message
          names it: a postcode, area, station or address (for example "N1 9GU",
          "King's Cross", "Brixton"). If they only say "home" without naming a
          place, or do not mention getting home, return an empty string rather
          than guessing.
      - name: open_until
        type: string
        required: false
        description: >-
          The time the person wants the venue to stay open until, only if they
          said one, written as in the message (for example "open till 2am" is
          "2am", "until half one" is "1:30am", "past midnight" is "midnight").
          If they did not name a time, or only said "late", return an empty
          string rather than guessing.
    output:
      - name: location_used
        type: string
        description: The place searched around, as Google Maps named it.
      - name: search_radius_m
        type: integer
        description: How far around the place was searched, in metres.
      - name: venues
        type: array
        item_type: string
        description: >-
          Venues open now, latest closing first and open-24-hours places last,
          each as "name (kind, distance, walking time): open till <time>". If
          open_until was given, only those open at least that late.
      - name: open_count
        type: integer
        description: How many venues in range are open now.
      - name: closed_count
        type: integer
        description: How many venues in range are closed now.
      - name: unknown_hours
        type: array
        item_type: string
        description: Venues in range whose opening hours Google does not have.
      - name: latest_venue
        type: string
        required: false
        description: >-
          The first venue in the list: the one with the latest closing time,
          or an open-24-hours place if nothing else qualifies.
      - name: latest_closing
        type: string
        required: false
        description: When that venue closes, as words, e.g. "open till 2am".
      - name: latest_closes_at
        type: datetime
        required: false
        description: When that venue closes, with its UTC offset. Absent if open 24 hours.
      - name: open_until_used
        type: string
        required: false
        description: The time venues had to stay open until, as understood, e.g. "2am Saturday".
      - name: closing_too_early
        type: integer
        required: false
        description: How many venues open now were left out for closing before open_until.
      - name: destination_used
        type: string
        required: false
        description: The destination routes were planned to, as Google Maps named it.
      - name: routes_home
        type: array
        item_type: string
        required: false
        description: >-
          For the first five venues, in the same order as venues (so
          open-24-hours places only when fewer than five others qualify): when
          to leave (closing time, or now if open 24 hours), when you'd get home, the
          journey time and the legs, from TfL's journey planner.
      - name: route_disruptions
        type: array
        item_type: string
        required: false
        description: Current TfL problems on the lines those routes use.
      - name: latest_venue_home_at
        type: datetime
        required: false
        description: When you'd get home leaving the latest-open venue at its closing time.
      - name: latest_venue_journey_min
        type: integer
        required: false
        description: How many minutes that journey home takes.
      - name: latest_venue_route
        type: string
        required: false
        description: That journey's legs, e.g. "walk 4 min > 14 bus > Victoria line > walk 15 min".
      - name: route_note
        type: string
        required: false
        description: Why there are no routes home, when a destination was given but none could be planned.

app_secrets:
  - name: GOOGLE_MAPS_API_KEY
    description: "Google Maps Platform key with the Places API (New), used to find venues and opening hours"
    required: true
  - name: TFL_APP_KEY
    description: "TfL Unified API app key, used for journeys home; TfL also answers without one, at a lower rate limit"
    required: false
