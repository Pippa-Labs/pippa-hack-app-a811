# Running Tab's contract with Pippa. Everything Pippa shows a user about the
# app comes from this file, and the runtime refuses anything not declared here.

manifest_version: 1

# Every hackathon app keeps nothing between calls.
persistence: none

# Public: shown as "by <name>" next to the app. A pseudonym.
app_author_name: "Agent Binder"

app:
  # hack. + repository name without pippa-hack-, hyphens as underscores.
  id: hack.app_a811
  name: Running Tab
  # Bump this before pushing again once a version is submitted for review.
  version: 0.1.0
  # Never use the word "b-y" here: the badge is split on it.
  summary: >-
    Finds pubs, bars and clubs still open near a UK place, latest closing
    first, including places that close after midnight. Sends the place name to
    Google Maps to look up venues and opening hours.

agent_types:
  - personal

outcomes:
  - id: venues.latest
    summary: Pubs and bars open near a place, ranked from latest closing time
    example_phrases:
      - where can i still get a drink near
      - which pubs are open late near
      - what bars are still open around
      - which bar near here closes latest
      - pubs open after midnight near
      - where is open latest for a drink
      - late night bars near
      - is anywhere still serving drinks near
    inputs:
      - name: location
        type: string
        required: false
        description: >-
          Where the person is or wants to drink: an area, street, station,
          postcode or "lat, lon" coordinates, written as in the message
          (for example "South Kensington", "N1 9GU", "near Old Street
          station" becomes "Old Street station"). If the message does not
          name a place, return an empty string rather than guessing.
      - name: walk_minutes
        type: integer
        required: false
        description: >-
          How many minutes the person is willing to walk, only if they said so
          (for example "within 5 minutes' walk" is 5). Leave this out entirely
          if they did not mention it. Never guess a value.
    output:
      - name: location_used
        type: string
        description: The place searched around, as Google Maps named it.
      - name: search_radius_m
        type: integer
        description: How far around the place was searched, in metres.
      - name: venues
        type: array
        item_type: string
        description: >-
          Venues open now, latest closing first, each as "name (kind,
          distance, walking time): open till <time>".
      - name: open_count
        type: integer
        description: How many venues in range are open now.
      - name: closed_count
        type: integer
        description: How many venues in range are closed now.
      - name: unknown_hours
        type: array
        item_type: string
        description: Venues in range whose opening hours Google does not have.
      - name: latest_venue
        type: string
        required: false
        description: The name of the venue that stays open latest.
      - name: latest_closing
        type: string
        required: false
        description: When that venue closes, as words, e.g. "open till 2am".
      - name: latest_closes_at
        type: datetime
        required: false
        description: When that venue closes, with its UTC offset. Absent if open 24 hours.

app_secrets:
  - name: GOOGLE_MAPS_API_KEY
    description: "Google Maps Platform key with the Places API (New), used to find venues and opening hours"
    required: true
